<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="160" height="60">
  <defs>
    <!-- Stripe mask for BLUE -->
    <mask id="stripe-blue">
      <rect width="320" height="120" fill="white"/>
      <rect y="28" width="320" height="4" fill="black"/>
      <rect y="36" width="320" height="4" fill="black"/>
      <rect y="44" width="320" height="4" fill="black"/>
      <rect y="52" width="320" height="4" fill="black"/>
      <rect y="60" width="320" height="4" fill="black"/>
    </mask>
    <!-- Stripe mask for VECTOR -->
    <mask id="stripe-vec">
      <rect width="320" height="120" fill="white"/>
      <rect y="72" width="320" height="4" fill="black"/>
      <rect y="80" width="320" height="4" fill="black"/>
      <rect y="88" width="320" height="4" fill="black"/>
      <rect y="96" width="320" height="4" fill="black"/>
      <rect y="104" width="320" height="4" fill="black"/>
    </mask>
  </defs>

  <!-- Arc / globe wireframe -->
  <g stroke="#888" stroke-width="0.8" fill="none" opacity="0.5">
    <!-- Horizontal arcs -->
    <path d="M 20,60 Q 160,-20 300,60"/>
    <path d="M 10,75 Q 160,10 310,75"/>
    <path d="M 20,90 Q 160,40 300,90"/>
    <!-- Radial lines from center-right -->
    <line x1="230" y1="55" x2="20" y2="15"/>
    <line x1="230" y1="55" x2="20" y2="55"/>
    <line x1="230" y1="55" x2="20" y2="95"/>
    <line x1="230" y1="55" x2="120" y2="5"/>
    <line x1="230" y1="55" x2="310" y2="10"/>
    <line x1="230" y1="55" x2="310" y2="100"/>
    <!-- Center circle -->
    <circle cx="230" cy="55" r="5"/>
  </g>

  <!-- Blue accent dots -->
  <g fill="#4a9eff">
    <rect x="17" y="11" width="7" height="7" transform="rotate(45,20.5,14.5)"/>
    <rect x="117" y="2" width="7" height="7" transform="rotate(45,120.5,5.5)"/>
    <rect x="207" y="2" width="7" height="7" transform="rotate(45,210.5,5.5)"/>
    <rect x="270" y="30" width="7" height="7" transform="rotate(45,273.5,33.5)"/>
    <rect x="300" y="78" width="7" height="7" transform="rotate(45,303.5,81.5)"/>
    <rect x="10" y="88" width="7" height="7" transform="rotate(45,13.5,91.5)"/>
  </g>

  <!-- BLUE text with stripe effect -->
  <text
    x="8" y="68"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="52"
    font-weight="900"
    font-style="italic"
    fill="white"
    mask="url(#stripe-blue)"
    letter-spacing="-1"
  >BLUE</text>

  <!-- VECTOR text with stripe effect -->
  <text
    x="8" y="115"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="46"
    font-weight="900"
    font-style="italic"
    fill="white"
    mask="url(#stripe-vec)"
    letter-spacing="-1"
  >VECTOR</text>
</svg>
